<!DOCTYPE html>
<html lang="zh">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>个人中心</title>
		<link rel="stylesheet" href="./components/layui/css/layui.css" />
		<link rel="stylesheet" href="./css/common.css" />
		<link rel="stylesheet" href="./css/user.css" />
	</head>
	<style>

	</style>
	<body>
		<div class="common-head-wrap">
			<div class="back"></div>
			<div class="head-title"></div>
			<div class="more"></div>
		</div>
		<div class="common-padding-wrap">

		</div>
		<script id="userInfo" type="text/html">
		{{console.log(d)}}
		<div class="user-vip-info-wrap" type="{{d.vipLevel}}">
			<div class="vip-info-wrap">
				<div class="vip-title-wrap">
					<h3 class="vip-title">vip会员</h3>
					<div class="vip-subTitle">
						{{# if(d.vipLevel>0){ }}
							已开通
							{{# } else { }}
								未开通
								{{# } }}
					</div>
				</div>
				<div class="vip-icon"></div>
			</div>
			<div class="user-info-wrap">
				<div class="user-info">
					<img class="user-header" src="{{d.header}}" alt="">
					<div class="user-name">{{d.name}}</div>
				</div>
				<div class="user-vip-tip">
					{{# if(d.vipLevel>0){ }}
						你已开通VIP会员
						{{# } else { }}
							你还不是VIP会员
							{{# } }}
				</div>
			</div>
			<a class="vip-agreement" href="javascript:void(0);">《会员服务协议》</a>
			<div class="combo-wrap">
				<div class="combo-title">
					选择续费套餐 <span>购买后自动延长到期时间</span>
				</div>
				<div class="combo-list-window">
					<ul class="combo-list-wrap">
						{{# layui.each(d.combo, function(index, item){ }}
							<li class="combo-list {{# if(index==0){ }}selected{{# } }}">
								<div class="label">{{item.title1}}</div>
								<div class="title">{{item.title2}}</div>
								<div class="subTitle">{{item.title3}}</div>
								<div class="money">{{item.title4}}</div>
								<div class="original-price">{{item.title5}}</div>
							</li>
							{{# }); }}
					</ul>
				</div>
			</div>

		</div>
		<div class="compare-wrap">
			<div class="compare-banner">
				<h3 class="compare-title">
					开通VIP </br>
					<span>权益对比</span>
				</h3>
				<div class="banner"></div>
			</div>
			<div class="compare-wrap">
				<div class="compare-list-wrap" type='noVip'>
					<h3 class="title">开通前</h3>
					{{# layui.each(d.compare.noVip, function(index, item){ }}
						<div class="compare-list">
							<div class="icon"></div>
							<div class="compare-info">
								<div class="info-title">
									{{item.title}}
									<span>{{item.situation}}</span>
								</div>
								<div class="info-subTitle">{{item.subTitle}}</div>
							</div>
						</div>
						{{# }); }}
				</div>
				<div class="compare-list-wrap" type='vip'>
					<h3 class="title">开通后</h3>
					{{# layui.each(d.compare.vip, function(index, item){ }}
						<div class="compare-list">
							<div class="icon"></div>
							<div class="compare-info">
								<div class="info-title">
									{{item.title}}
									<span>{{item.situation}}</span>
								</div>
								<div class="info-subTitle">{{item.subTitle}}</div>
							</div>
						</div>
						{{# }); }}
				</div>
			</div>
		</div>
		</script>
	</body>
