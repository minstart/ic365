<!DOCTYPE html>
<html lang="zh">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>家长账户关联管理</title>
		<link rel="stylesheet" href="./components/layui/css/layui.css" />
		<link rel="stylesheet" href="./css/common.css" />
	</head>
	<style>
		.common-padding-wrap {
			padding: 0.67rem 0.43rem;
		}

		.content-wrap {
			font-size: 0.15rem;
			text-align: left;
		}

		.layui-form-item {
			border-bottom: 0.01rem solid #f3f3f3;
		}

		.layui-input {
			border-width: 0;
			line-height: 0.38rem;
			font-size: 0.16rem;
		}

		.content-wrap .title {
			color: #f6ac32;
			margin-bottom: 0.6rem;
			font-size: 0.15rem;
		}

		.get-code-btn {
			text-align: center;
			line-height: 0.38rem;
			padding: 0 0.1rem;
		}

		.layui-form .layui-form-checkbox div {
			white-space: normal;
			color: #000;
			font-size: 0.12rem;
			padding-right: 0;
		}

		.layui-form .layui-form-checkbox .layui-icon {
			border-radius: 50% !important;

		}

		.layui-form .layui-form-checkbox[lay-skin="primary"]:hover i {
			border-color: #f6ac32;
		}

		.layui-form .layui-form-checked[lay-skin="primary"] i {
			border-color: #f6ac32 !important;
			background-color: #f6ac32 !important;
			color: #fff;
			border-color: #f6ac32 !important;
		}

		.layui-form .layui-form-item {
			margin-bottom: 0.27rem;
		}

		.layui-btn {
			background-color: #f6ac32;
			width: 100%;
			font-size: 0.16rem;
			height: 0.4rem;
			line-height: 0.4rem;
		}
		.layui-layer-btn .layui-layer-btn0{
			background-color: #f6ac32 !important;
		}
		.layui-layer-dialog{
			border-radius: 0.06rem !important;
		}
	</style>
	<body>
		<div class="common-head-wrap">
			<div class="back"></div>
			<div class="head-title">家长账户关联管理</div>
			<div class="more"></div>
		</div>
		<div class="common-padding-wrap">
			<div class="content-wrap">
				<h3 class="title">请输入“智算365”APP手机账号</h3>
				<form class="layui-form"> <!-- 提示：如果你不想用form，你可以换成div等任何一个普通元素 -->
					<div class="layui-form-item" style="display: flex;">
						<input type="text" lay-verify="required|phone" lay-reqText="请输入手机号" maxlength="11" name="phone" placeholder="请输入手机号" autocomplete="off" class="layui-input" style="flex: 1;">
						<div class="get-code-btn" onclick="getCode()">发送验证码</div>
					</div>
					<div class="layui-form-item">
						<input type="text" lay-verify="required" name="code" placeholder="请输入短信验证码" autocomplete="off" class="layui-input">
					</div>
					<div class="layui-form-item" style="margin-bottom: 0.7rem;">
						<input type="checkbox" lay-verify="required" id="agreement" name="agreement" lay-skin="primary" title="同意通过 “学养网” 公众号，查看您孩子的学习报告和开通会员">
					</div>
					<div class="layui-form-item">
						<button type="submit" class="layui-btn" lay-submit="" onclick="return false;" lay-filter="demo1">确认绑定</button>
					</div>
				</form>
			</div>
		</div>
	</body>
	<script src="./js/rem.js"></script>
	<script src="./js/jquery-1.11.1.min.js"></script>
	<script src="./components/layui/layui.js"></script>
	<script>
		$(function() {
			let url = window.location.href;
			let code = null;
			var appid = "wx410cfeb85cd30d9c";

			// 判断 url 中有没有code=字符串，没有跳转到授权页面  
			if (url.indexOf('code=') == -1) {
				let currentURL = encodeURIComponent(url);
				//scope 为 snsapi_userinfo
				// let redirect_uri = `https://open.weixin.qq.com/connect/oauth2/authorize?appid=${appid}&redirect_uri=${currentURL}&response_type=code&scope=snsapi_userinfo&state=STATE#wechat_redirect`
				// window.location.href = redirect_uri;
			} else {
				//回调函数已经执行 返回的链接存在code= 地址解析
				let code = url.split("code=")[1].split("&")[0];
				console.log(code)
				//对 getUserOpenid 云函数发送请求传参 code 获取用户信息
				// const res = await uniCloud.callFunction({
				// 	name: 'getUserOpenid',
				// 	data: {
				// 		code: code
				// 	},
				// })
				// console.log(res.result)
				// if(res.result.code==200){
				// 	userInfo.value=res.result.userInfo
				// }
			}

			// 点击获取验证码
			var isSend = false;
			var timeDate = 60;
			var _btnName = "发送验证码"
			// 发送验证码
			getCode = function() {
				layer.msg("获取验证码")
				isSend = true;
				var _btn = $(".get-code-btn");
				_btn.html(timeDate + "s")
				var time = setInterval(function() {
					timeDate = timeDate - 1;
					if (timeDate == 0) {
						clearInterval(time)
						isSend = false;
						timeDate = 60;
						_btn.html(_btnName)
						return false;
					}
					_btn.html(timeDate + "s")
				}, 1000)
			}

			layui.use(['form', 'layer'], function() { //如果只加载一个模块，可以不填数组。如：layui.use('form')
				var form = layui.form, //获取form模块
					layer = layui.layer; //获取upload模块

				function bindUser(data){
					console.log(data)
				}
				//监听提交按钮
				form.on('submit()', function(data) {
					// console.log(data);
					if (!data.field.agreement) {
						layer.confirm('您是否'+$("input[name='agreement']").attr("title")+"？", {
							title:"",
							btn: ['同意', '拒绝'], //可以无限个按钮
							btnAlign: 'c'
						}, function(index, layero) {
							//按钮【按钮一】的回调
							document.getElementById('agreement').checked = true;
							layer.closeAll()
							delete data.field.agreement;
							bindUser(data.field)
						});
						return false;
					}else{
						delete data.field.agreement;
						bindUser(data.field)
					}
				});


			});

		})
	</script>
</html>
